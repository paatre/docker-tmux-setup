version: '3.8'
services:
  runserver:
    image: busybox
    ports:
      - "8001:8000" # Host:Container
      - "1234"      # Container only
    command: ["sleep", "infinity"]
  api:
    image: busybox
    expose:
      - "8080"
      - "8081"
    command: ["sleep", "infinity"]
  db:
    image: busybox
    # No ports or expose, should fallback to 5432
    command: ["sleep", "infinity"]
  postgres:
    image: busybox
    # No ports or expose, should fallback to 5432
    command: ["sleep", "infinity"]
  customport:
    image: busybox
    ports:
      - "9000" # Container port only, no colon
    command: ["sleep", "infinity"]
  anotherapp:
    image: busybox
    # No ports, expose, or special name, should fallback to 8000
    command: ["sleep", "infinity"]
  prioritytest:
    image: busybox
    ports:
      - "5000:5001" # Should pick 5001 from here
    expose:
      - "6000"      # Should be ignored if ports has an entry
    command: ["sleep", "infinity"]
